# Settings for the SDK's tests and linting. The package itself is built from the
# repository's root pyproject.toml (the myrcp wheel, with the workbench built in); the
# tests import the SDK from here (pythonpath) and need pytest and pyte:
#   uv venv && uv pip install pytest pyte     (./build.sh test does this)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
